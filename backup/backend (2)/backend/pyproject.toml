[project]
name = "nex-agi-backend"
version = "0.1.0"
description = "NEX AGI — decentralized multi-agent operating system (backend)"
requires-python = ">=3.12"
dependencies = [
    # Runtime / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",   # required by langgraph-checkpoint-postgres (sync driver)
    # LangChain v1 / LangGraph v1  (R1: verified via LangChain docs MCP 2025-06-17)
    # import paths: langchain.agents.create_agent, langgraph.graph.StateGraph,
    #               langgraph.checkpoint.postgres.PostgresSaver,
    #               langgraph.store.postgres.PostgresStore
    "langchain>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3.0",
    # deepagents (R1: verified 0.6.10, 2026-06-18). Step 4 uses create_deep_agent(
    #   model, tools, *, system_prompt, skills, memory, backend, store, response_format)
    #   + deepagents.backends {CompositeBackend, StateBackend, StoreBackend, FilesystemBackend}.
    #   This surface differs from older drafts (no FilesystemMiddleware routes= kwarg),
    #   so pin to the verified minor to avoid silent API drift.
    "deepagents>=0.6.10,<0.7.0",
    # Provider integrations (install all; agents pick at runtime via model resolution layer)
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openrouter>=0.0.1",
    "langchain-google-genai>=2.0.0",
    "langchain-aws>=0.2.0",
    # Infrastructure
    "redis>=5.0.0",
    # Multipart form parsing — required by FastAPI for file uploads (chat
    # attachments, ARCH §8.5.3). R1: Starlette imports `python_multipart`; the
    # PyPI distribution name is `python-multipart`. Verified needed by the
    # `UploadFile`/`Form` path (Step 10).
    "python-multipart>=0.0.18",
    # Observability
    "langsmith>=0.2.0",
    "pypdf>=6.13.3",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pytesseract>=0.3.13",
    "beautifulsoup4>=4.15.0",
    "unstructured>=0.23.1",
    "matplotlib>=3.11.0",
    "fpdf2>=2.8.7",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "sqlalchemy[mypy]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN"]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# Alembic autogenerates migration bodies; long DDL literals (e.g. CHECK lists) and
# its import order are generated, not hand-maintained.
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring a live, migrated Postgres (docker compose up + alembic upgrade head)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
