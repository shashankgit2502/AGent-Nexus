# Alembic configuration — NEX AGI backend
# See TECHNICAL.md §11.7–§11.8 for migration notes.

[alembic]
script_location = alembic
prepend_sys_path = .

# DATABASE_URL is sourced from the environment / .env in alembic/env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Auto-format generated migration files
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/.venv/Scripts/ruff.exe
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
